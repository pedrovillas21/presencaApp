ServerName 127.0.0.1
ServerSignature Off
ServerTokens Prod

# O Apache filtra o header Authorization antes de entregá-lo ao PHP, então
# $_SERVER['HTTP_AUTHORIZATION'] nunca existe sob mod_php e todas as rotas
# autenticadas (o painel de admin inteiro) respondem 401. Reinjeta o header
# no ambiente. Requer mod_setenvif, habilitado por padrão na imagem oficial.
SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
